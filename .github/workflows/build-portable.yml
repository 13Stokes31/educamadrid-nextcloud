name: Build portable Linux binary

on:
  push:
    branches:
      - fix/nextcloud-34-compat
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libdbus-1-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Build release
        run: cargo build --release --locked

      - name: Strip binary
        run: strip target/release/nextcloud-educamadrid

      - name: Show binary info
        run: |
          file target/release/nextcloud-educamadrid
          ldd target/release/nextcloud-educamadrid
          strings target/release/nextcloud-educamadrid | grep -o 'GLIBC_[0-9.]\+' | sort -Vu | tail

      - uses: actions/upload-artifact@v4
        with:
          name: nextcloud-educamadrid-linux-x86_64-portable
          path: target/release/nextcloud-educamadrid
          if-no-files-found: error
