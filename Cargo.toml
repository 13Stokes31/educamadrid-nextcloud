[package]
name = "educamadrid-nextcloud"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "GUI para dar de alta la cuenta Nextcloud de EducaMadrid en el cliente de escritorio (KDE Plasma)"
license = "MIT"
repository = "https://github.com/13Stokes31/educamadrid-nextcloud"

[[bin]]
name = "educamadrid-nextcloud"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
dbus = "0.9"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
dirs = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
