[package]
name = "educamadrid-nextcloud"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "educamadrid-nextcloud"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
dbus = "0.9"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
dirs = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
